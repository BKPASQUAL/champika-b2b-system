<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bkl-bg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#1f2b45" />
      <stop offset="70%" stop-color="#131c30" />
      <stop offset="100%" stop-color="#0c1322" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bkl-bg)" />

  <!-- House mark -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof + walls -->
    <path d="M368 352 L512 240 L656 352" stroke="#38aef0" stroke-width="22" />
    <path d="M584 296 V256" stroke="#38aef0" stroke-width="22" />
    <path d="M410 340 V436" stroke="#38aef0" stroke-width="20" />
    <path d="M614 340 V430" stroke="#38aef0" stroke-width="20" />

    <!-- B -->
    <path d="M442 378 V446" stroke="#38aef0" stroke-width="15" />
    <path d="M430 378 H476 a17 17 0 0 1 0 34 H442" stroke="#38aef0" stroke-width="15" />
    <path d="M442 412 H480 a17 17 0 0 1 0 34 H428" stroke="#38aef0" stroke-width="15" />

    <!-- K -->
    <path d="M522 286 V446" stroke="#38aef0" stroke-width="15" />
    <path d="M578 372 L526 410 L582 446" stroke="#38aef0" stroke-width="15" />

    <!-- Orange cord -->
    <path d="M410 436 Q410 470 444 470 H566" stroke="#f28a2e" stroke-width="14" />
  </g>

  <!-- Plug -->
  <g fill="#f28a2e">
    <path d="M560 452 H584 a14 14 0 0 1 14 14 V474 a14 14 0 0 1 -14 14 H560 Z" />
    <rect x="596" y="456" width="30" height="9" rx="4.5" />
    <rect x="596" y="475" width="30" height="9" rx="4.5" />
  </g>

  <!-- Wordmark -->
  <text x="512" y="612" text-anchor="middle"
        font-family="Montserrat, 'Arial Black', 'Segoe UI', Arial, sans-serif"
        font-weight="900" font-size="104" letter-spacing="1">
    <tspan fill="#ffffff">BK</tspan><tspan dx="30" fill="#38aef0">WIRING</tspan>
  </text>

  <!-- Sinhala tagline -->
  <text x="512" y="702" text-anchor="middle"
        font-family="'Noto Sans Sinhala', 'Iskoola Pota', 'Nirmala UI', sans-serif"
        font-weight="700" font-size="66" fill="#f28a2e">බඩු කඩේ</text>

  <!-- Store line -->
  <circle cx="196" cy="764" r="12" fill="#f28a2e" />
  <text x="530" y="780" text-anchor="middle"
        font-family="'Segoe UI', 'Open Sans', Arial, sans-serif"
        font-weight="700" font-size="44" letter-spacing="7" fill="#d5d9e0">HOUSE WIRING STORE</text>
</svg>
